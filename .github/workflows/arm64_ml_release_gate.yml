name: ARM64 ML Release Gate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  arm64-embedded-benchmark:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (ARM64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Audio & LiteRT Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1 wget file
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stages 1-3 (Signal QA, Fold 4 Shift Audit & Folds 1-3 Training)
        run: |
          python ingest_qa.py
          python consensus_drift.py
          python train_quantize.py --version all --run-ablations

      - name: Download Prebuilt ARM64 LiteRT Benchmark Binary
        run: |
          wget --https-only --retry-connrefused --waitretry=5 --tries=3 --timeout=30 -q -O benchmark_model \
            https://storage.googleapis.com/tensorflow-nightly-public/prod/tensorflow/release/lite/tools/nightly/latest/linux_aarch64_benchmark_model
          file benchmark_model | grep -q "ELF 64-bit LSB.*ARM aarch64"
          chmod +x benchmark_model

      - name: Capture ARM64 Operator-Level Hardware Telemetry (Raw CPU vs. XNNPACK Delegate)
        run: |
          MODEL_SHA256=$(sha256sum models/v2_robust_augmented/model_int8.tflite | awk '{print $1}')
          {
            echo "Model SHA256: ${MODEL_SHA256}"
            echo "================================================================================"
            echo " PASS 1: NATIVE ARM64 RAW CPU KERNEL PROFILE (1 Thread, --use_xnnpack=false)"
            echo "================================================================================"
          } > reports/05_arm64_hardware_telemetry_int8.txt
          ./benchmark_model \
            --graph=models/v2_robust_augmented/model_int8.tflite \
            --num_threads=1 \
            --warmup_runs=20 \
            --num_runs=200 \
            --use_xnnpack=false \
            --enable_op_profiling=true \
            --profiling_output_csv_file=reports/05_arm64_op_profile_int8.csv \
            2>&1 | tee -a reports/05_arm64_hardware_telemetry_int8.txt

          {
            echo ""
            echo "================================================================================"
            echo " PASS 2: NATIVE ARM64 XNNPACK DELEGATE PROFILE (1 Thread, --use_xnnpack=true)"
            echo "================================================================================"
          } >> reports/05_arm64_hardware_telemetry_int8.txt
          ./benchmark_model \
            --graph=models/v2_robust_augmented/model_int8.tflite \
            --num_threads=1 \
            --warmup_runs=20 \
            --num_runs=200 \
            --use_xnnpack=true \
            --enable_op_profiling=true \
            2>&1 | tee -a reports/05_arm64_hardware_telemetry_int8.txt

      - name: Run Stage 4 Release Gate (Locked Fold 5 + Enforced ARM64 Telemetry)
        run: python release_gate.py --require-arm64-telemetry

      - name: Run Pipeline Test Suite
        run: pytest test_pipeline.py

      - name: Render Release Scorecard in GitHub Step Summary
        run: |
          echo "## PixelSense-Lite Release Gate Scorecard" >> $GITHUB_STEP_SUMMARY
          cat reports/04_release_gate_scorecard.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Native ARM64 Operator Telemetry (v2 INT8)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 45 reports/05_arm64_hardware_telemetry_int8.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publish Release Artifacts & Hardware Telemetry
        uses: actions/upload-artifact@v4
        with:
          name: arm64-ml-release-package
          path: |
            models/**/*.tflite
            reports/*
